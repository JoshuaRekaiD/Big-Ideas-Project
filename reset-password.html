<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Birp</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#613aa4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Birp" />
  <link rel="apple-touch-icon" href="assets/images/hippo.png" />
  <link rel="stylesheet" href="css/main.css?v=32" />
  <link rel="stylesheet" href="css/animations.css?v=7" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/images/logo.png" alt="Birp" class="logo-img" />
      </a>
    </div>
  </nav>

  <section class="reset-section">
    <div class="container">
      <div class="reset-inner">
        <div class="reset-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Set a new password</h1>
        <p>Enter your new password below.</p>

        <form class="auth-form reset-form" id="resetPasswordForm">
          <label>New Password
            <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6" />
          </label>
          <label>Confirm Password
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required minlength="6" />
          </label>
          <button type="submit" class="btn-primary full-width" id="resetBtn">Update Password</button>
        </form>

        <div class="reset-success hidden" id="resetSuccess">
          <div class="reset-success-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M7 12l3.5 3.5L17 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2>Password updated!</h2>
          <p>Your password has been changed successfully.</p>
          <a href="index.html" class="btn-primary">Back to home</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    const form    = document.getElementById('resetPasswordForm');
    const success = document.getElementById('resetSuccess');
    const btn     = document.getElementById('resetBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPw  = document.getElementById('newPassword').value;
      const confPw = document.getElementById('confirmPassword').value;

      if (newPw !== confPw) {
        alert('Passwords do not match.');
        return;
      }

      btn.textContent = 'Updating…';
      btn.disabled    = true;

      const { error } = await _supabase.auth.updateUser({ password: newPw });

      if (error) {
        alert('Error: ' + error.message);
        btn.textContent = 'Update Password';
        btn.disabled    = false;
      } else {
        form.classList.add('hidden');
        success.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
